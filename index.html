<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL DESIGN — TaskFlow Marine & Naval Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root[data-theme="light"] {
            --bg: #eef2f6;
            --bg-pattern: radial-gradient(circle at 15% 10%, rgba(15, 41, 74, 0.06), transparent 42%),
                          radial-gradient(circle at 88% 15%, rgba(180, 138, 60, 0.08), transparent 38%),
                          linear-gradient(180deg, #f5f7fa 0%, #e9eef5 100%);
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --text: #0f1c2e;
            --muted: #5c6d82;
            --border: #d9e2ec;
            --accent: #0f294a;
            --accent-hover: #183c69;
            --accent-soft: rgba(15, 41, 74, 0.08);
            --gold: #b48a3c;
            --gold-soft: rgba(180, 138, 60, 0.14);
            --ok: #15803d;
            --ok-bg: #dcfce7;
            --warn: #b45309;
            --warn-bg: #fef3c7;
            --bad: #b91c1c;
            --bad-bg: #fee2e2;
            --info: #0369a1;
            --info-bg: #e0f2fe;
            --shadow: 0 10px 28px rgba(15, 28, 46, 0.06);
        }

        :root[data-theme="dark"] {
            --bg: #07111f;
            --bg-pattern: radial-gradient(circle at 15% 10%, rgba(30, 86, 148, 0.18), transparent 45%),
                          radial-gradient(circle at 88% 12%, rgba(212, 172, 92, 0.10), transparent 40%),
                          linear-gradient(180deg, #060e1a 0%, #0a1628 100%);
            --surface: #0d1c30;
            --surface-2: #12243d;
            --text: #edf2f7;
            --muted: #94a7bd;
            --border: #1e334f;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.14);
            --gold: #d4ac5c;
            --gold-soft: rgba(212, 172, 92, 0.16);
            --ok: #4ade80;
            --ok-bg: rgba(21, 128, 61, 0.24);
            --warn: #fbbf24;
            --warn-bg: rgba(180, 83, 9, 0.24);
            --bad: #f87171;
            --bad-bg: rgba(185, 28, 28, 0.24);
            --info: #38bdf8;
            --info-bg: rgba(3, 105, 161, 0.24);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Roboto, -apple-system, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: var(--bg-pattern);
            color: var(--text);
            padding: 20px 16px 36px;
            min-height: 100vh;
        }

        .wrap {
            max-width: 1020px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .brand-banner {
            border-top: 3px solid var(--gold);
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-emblem {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--accent-soft);
            border: 1px solid rgba(180, 138, 60, 0.35);
            display: grid;
            place-items: center;
            color: var(--gold);
            flex-shrink: 0;
        }

        .brand-kicker {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2px;
        }

        h1 {
            margin: 0;
            font-size: 1.24rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: -0.005em;
        }

        .muted {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        input, select, button {
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 0.9rem;
            background: var(--surface-2);
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input, select {
            flex: 1;
            min-width: 165px;
        }

        button {
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-theme {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 0.84rem;
            padding: 9px 12px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: var(--gold-soft);
            color: var(--gold);
            border: 1px solid rgba(180, 138, 60, 0.28);
        }

        .online-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--ok-bg);
            color: var(--ok);
        }

        .dot-live {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            display: inline-block;
        }

        .presence-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .presence-online {
            color: var(--ok);
        }

        .presence-offline {
            color: var(--muted);
        }

        .dot-off {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            opacity: 0.55;
            display: inline-block;
        }

        .progress-track {
            height: 9px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin: 10px 0 14px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            width: 0%;
            transition: width 0.3s ease;
        }

        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: 10px;
        }

        .member-box {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .member-box.is-online {
            border-left-color: var(--ok);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
        }

        .pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
        }

        .st-todo { background: var(--warn-bg); color: var(--warn); }
        .st-doing { background: var(--info-bg); color: var(--info); }
        .st-done { background: var(--ok-bg); color: var(--ok); }

        .msg {
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 18px;
        }

        .msg.err { color: var(--bad); font-weight: 600; }
        .msg.ok { color: var(--ok); font-weight: 600; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card brand-banner top">
        <div class="brand-row">
            <div class="brand-emblem" aria-hidden="true">
                <!-- Logo SVG ROYAL DESIGN: la bàn hàng hải + đường mũi tàu tối giản -->
                <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="14" cy="14" r="10.5" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="14" cy="14" r="2.2" fill="currentColor"/>
                    <path d="M14 5.5L16.4 11.6L22.5 14L16.4 16.4L14 22.5L11.6 16.4L5.5 14L11.6 11.6L14 5.5Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                    <path d="M6.5 20.5C9.5 19 12.2 19 14 20.5C15.8 22 18.5 22 21.5 20.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
                </svg>
            </div>
            <div>
                <div class="brand-kicker">Royal Design · Marine &amp; Naval Engineering</div>
                <h1>TaskFlow Team Cloud</h1>
                <div class="muted" id="subHeader">Điều phối bản vẽ, hạng mục thiết kế &amp; tiến độ đội ngũ</div>
            </div>
        </div>

        <div class="row" style="align-items:center;">
            <button type="button" class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()" title="Chuyển chế độ Sáng / Tối">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">Chế độ Tối</span>
            </button>

            <div id="sessionBar" class="row hidden" style="align-items:center;">
                <span id="userLabel" style="font-weight:700; font-size:0.9rem;"></span>
                <span class="badge" id="roleBadge">MEMBER</span>
                <button onclick="signOutUser()">Đăng xuất</button>
            </div>
        </div>
    </div>

    <!-- AUTH CARD -->
    <div class="card" id="authCard">
        <div class="row" style="margin-bottom:12px;">
            <button type="button" class="btn-primary" id="tabLogin" onclick="setAuthTab('login')">Đăng nhập</button>
            <button type="button" id="tabSignup" onclick="setAuthTab('signup')">Đăng ký tài khoản mới</button>
        </div>

        <form id="authForm" class="row">
            <input type="text" id="authName" class="hidden" placeholder="Họ và tên (VD: Nguyễn Văn A)">
            <input type="email" id="authEmail" placeholder="Email đăng nhập" required>
            <input type="password" id="authPassword" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required>
            <button type="submit" class="btn-primary" id="authSubmitBtn">Đăng nhập</button>
        </form>
        <div class="msg" id="authMsg"></div>
    </div>

    <!-- APP CARD -->
    <div id="appCard" class="hidden">
        <div class="card">
            <div class="top">
                <h2>Tiến độ tổng thể &amp; từng thành viên</h2>
                <div class="row" style="align-items:center;">
                    <span class="online-chip" id="onlineCountBadge">
                        <span class="dot-live"></span>
                        <span id="onlineCountText">0 đang online</span>
                    </span>
                    <span class="muted" id="overallText">0/0 hoàn thành</span>
                </div>
            </div>
            <div class="progress-track"><div class="progress-fill" id="overallBar"></div></div>
            <div class="member-grid" id="memberGrid"></div>
        </div>

        <div class="card hidden" id="adminCreateCard">
            <h2>Admin giao việc mới</h2>
            <form id="createTaskForm" class="row">
                <input type="text" id="taskTitle" placeholder="Hạng mục / bản vẽ thiết kế tàu..." style="flex:2; min-width:200px;" required>
                <select id="taskAssignee" required></select>
                <input type="datetime-local" id="taskDeadline" title="Hạn chót">
                <button type="submit" class="btn-primary">+ Giao việc</button>
            </form>
            <div class="msg" id="taskMsg"></div>
        </div>

        <div class="card">
            <div class="top">
                <h2 id="listHeading">Danh sách công việc</h2>
                <button onclick="refreshAll()">🔄 Đồng bộ ngay</button>
            </div>
            <div class="task-list" id="taskList"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://zncieufipfknepjftpde.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuY2lldWZpcGZrbmVwamZ0cGRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzU4MTcsImV4cCI6MjExMDY1MTgxN30.3ih9lgzZ--mT8tH5mH6GgTOlWV7Jx0GSzNVN28bbRts';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function applyTheme(theme) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('royal_design_theme', nextTheme);
        const isDark = nextTheme === 'dark';
        document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
        document.getElementById('themeLabel').textContent = isDark ? 'Chế độ Sáng' : 'Chế độ Tối';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem('royal_design_theme') || 'light');

    let authMode = 'login';
    let currentUser = null;
    let currentProfile = null;
    let profiles = [];
    let tasks = [];
    let presenceChannel = null;
    let onlineUserIds = new Set();

    function setMsg(id, text, type = '') {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'msg' + (type ? ` ${type}` : '');
    }

    function setAuthTab(mode) {
        authMode = mode;
        const isSignup = mode === 'signup';
        document.getElementById('tabLogin').className = isSignup ? '' : 'btn-primary';
        document.getElementById('tabSignup').className = isSignup ? 'btn-primary' : '';
        document.getElementById('authName').classList.toggle('hidden', !isSignup);
        document.getElementById('authName').required = isSignup;
        document.getElementById('authSubmitBtn').textContent = isSignup ? 'Đăng ký' : 'Đăng nhập';
        setMsg('authMsg', '');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setMsg('authMsg', 'Đang xử lý...');
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const fullName = document.getElementById('authName').value.trim();

        if (authMode === 'signup') {
            const { error } = await sb.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName || email.split('@')[0] } }
            });
            if (error) return setMsg('authMsg', error.message, 'err');
            setMsg('authMsg', 'Đăng ký thành công! Bạn có thể đăng nhập ngay.', 'ok');
        } else {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) return setMsg('authMsg', error.message, 'err');
            setMsg('authMsg', 'Đăng nhập thành công.', 'ok');
        }
    });

    async function leavePresenceChannel() {
        if (presenceChannel) {
            try {
                await presenceChannel.untrack();
                await sb.removeChannel(presenceChannel);
            } catch (_err) {}
            presenceChannel = null;
        }
        onlineUserIds = new Set();
    }

    function syncOnlineUsersFromState() {
        if (!presenceChannel) {
            onlineUserIds = new Set();
            return;
        }
        const state = presenceChannel.presenceState();
        const activeIds = new Set();
        Object.values(state).forEach((entries) => {
            if (Array.isArray(entries)) {
                entries.forEach((entry) => {
                    if (entry?.user_id) activeIds.add(entry.user_id);
                });
            }
        });
        if (currentUser?.id) activeIds.add(currentUser.id);
        onlineUserIds = activeIds;
    }

    async function setupPresenceChannel() {
        await leavePresenceChannel();
        if (!currentUser) return;

        onlineUserIds = new Set([currentUser.id]);

        presenceChannel = sb.channel('royal-design-presence', {
            config: {
                presence: { key: currentUser.id }
            }
        });

        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                syncOnlineUsersFromState();
                renderWorkspace();
            })
            .on('presence', { event: 'join' }, () => {
                syncOnlineUsersFromState();
                renderWorkspace();
            })
            .on('presence', { event: 'leave' }, () => {
                syncOnlineUsersFromState();
                renderWorkspace();
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED' && currentUser) {
                    await presenceChannel.track({
                        user_id: currentUser.id,
                        email: currentUser.email,
                        full_name: currentProfile?.full_name || currentUser.email,
                        online_at: new Date().toISOString()
                    });
                    syncOnlineUsersFromState();
                    renderWorkspace();
                }
            });
    }

    async function signOutUser() {
        await leavePresenceChannel();
        await sb.auth.signOut();
    }

    async function loadProfilesAndTasks() {
        const { data: profData, error: profErr } = await sb
            .from('profiles')
            .select('id, email, full_name, role')
            .order('full_name', { ascending: true });

        if (!profErr && profData) {
            profiles = profData;
        }

        const matchedById = profiles.find(p => p.id === currentUser.id);
        const matchedByEmail = profiles.find(
            p => (p.email || '').toLowerCase() === (currentUser.email || '').toLowerCase()
        );

        let ownProfile = matchedById || matchedByEmail || null;
        if (!ownProfile) {
            const { data: singleProf } = await sb
                .from('profiles')
                .select('id, email, full_name, role')
                .eq('id', currentUser.id)
                .maybeSingle();
            ownProfile = singleProf;
        }

        currentProfile = ownProfile || {
            id: currentUser.id,
            email: currentUser.email,
            full_name: currentUser.user_metadata?.full_name || currentUser.email,
            role: 'member'
        };

        const { data: taskData, error: taskErr } = await sb
            .from('team_tasks')
            .select('id, title, assignee_id, assigned_by, deadline, status, created_at')
            .order('created_at', { ascending: false });

        if (!taskErr && taskData) {
            tasks = taskData;
        }
    }

    async function refreshAll() {
        if (!currentUser) return;
        await loadProfilesAndTasks();
        if (presenceChannel) {
            try {
                await presenceChannel.track({
                    user_id: currentUser.id,
                    email: currentUser.email,
                    full_name: currentProfile?.full_name || currentUser.email,
                    online_at: new Date().toISOString()
                });
            } catch (_err) {}
            syncOnlineUsersFromState();
        }
        renderWorkspace();
    }

    function getProfileName(id) {
        const p = profiles.find(x => x.id === id);
        return p ? `${p.full_name} (${p.email})` : 'Thành viên';
    }

    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if ((currentProfile?.role || '').toLowerCase() !== 'admin') return;

        const title = document.getElementById('taskTitle').value.trim();
        const assigneeId = document.getElementById('taskAssignee').value;
        const deadlineRaw = document.getElementById('taskDeadline').value;
        const deadline = deadlineRaw ? new Date(deadlineRaw).toISOString() : null;

        setMsg('taskMsg', 'Đang giao việc...');
        const { error } = await sb.from('team_tasks').insert({
            title,
            assignee_id: assigneeId,
            assigned_by: currentUser.id,
            deadline,
            status: 'todo'
        });

        if (error) return setMsg('taskMsg', error.message, 'err');
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDeadline').value = '';
        setMsg('taskMsg', 'Đã giao việc thành công.', 'ok');
        await refreshAll();
    });

    async function updateStatus(taskId, newStatus) {
        const { error } = await sb
            .from('team_tasks')
            .update({ status: newStatus })
            .eq('id', taskId);
        if (error) {
            alert('Không thể cập nhật trạng thái: ' + error.message);
            return;
        }
        await refreshAll();
    }

    async function deleteTask(taskId) {
        if ((currentProfile?.role || '').toLowerCase() !== 'admin') return;
        const { error } = await sb.from('team_tasks').delete().eq('id', taskId);
        if (!error) await refreshAll();
    }

    function renderWorkspace() {
        const isAdmin = (currentProfile?.role || '').toLowerCase() === 'admin';
        document.getElementById('userLabel').textContent = currentProfile?.full_name || currentUser.email;
        document.getElementById('roleBadge').textContent = isAdmin ? 'ADMIN' : 'MEMBER';
        document.getElementById('adminCreateCard').classList.toggle('hidden', !isAdmin);
        document.getElementById('listHeading').textContent = isAdmin
            ? 'Toàn bộ công việc & tiến độ nhóm'
            : 'Công việc được giao cho bạn';

        const assigneeSelect = document.getElementById('taskAssignee');
        assigneeSelect.innerHTML = profiles
            .map(p => `<option value="${p.id}">${p.full_name} (${p.role})</option>`)
            .join('');

        const total = tasks.length;
        const doneCount = tasks.filter(t => t.status === 'done').length;
        const pct = total ? Math.round((doneCount / total) * 100) : 0;
        document.getElementById('overallText').textContent = `${doneCount}/${total} hoàn thành (${pct}%)`;
        document.getElementById('overallBar').style.width = `${pct}%`;

        const onlineCount = onlineUserIds.size;
        document.getElementById('onlineCountText').textContent = `${onlineCount} đang online`;

        document.getElementById('memberGrid').innerHTML = profiles.map(p => {
            const isOnline = onlineUserIds.has(p.id);
            const mine = tasks.filter(t => t.assignee_id === p.id);
            const mineDone = mine.filter(t => t.status === 'done').length;
            const mineDoing = mine.filter(t => t.status === 'doing').length;
            return `
                <div class="member-box ${isOnline ? 'is-online' : ''}">
                    <div style="font-weight:700;">${p.full_name}</div>
                    <div class="muted">${p.email} · <span class="badge">${p.role}</span></div>
                    <div class="presence-status ${isOnline ? 'presence-online' : 'presence-offline'}">
                        <span class="${isOnline ? 'dot-live' : 'dot-off'}"></span>
                        <span>${isOnline ? 'Đang online' : 'Ngoại tuyến'}</span>
                    </div>
                    <div class="muted" style="margin-top:6px;">Xong: <strong>${mineDone}/${mine.length}</strong> · Đang làm: ${mineDoing}</div>
                </div>
            `;
        }).join('');

        const statusMap = {
            todo: ['Chờ làm', 'st-todo'],
            doing: ['Đang làm', 'st-doing'],
            done: ['Đã xong', 'st-done']
        };

        const listEl = document.getElementById('taskList');
        if (!tasks.length) {
            listEl.innerHTML = `<div class="muted">Chưa có công việc nào.</div>`;
            return;
        }

        listEl.innerHTML = tasks.map(t => {
            const [sLabel, sClass] = statusMap[t.status] || statusMap.todo;
            const dlStr = t.deadline
                ? ` · Hạn: ${new Date(t.deadline).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`
                : '';
            return `
                <div class="task-item">
                    <div>
                        <div style="font-weight:700;">${t.title}</div>
                        <div class="muted">Phụ trách: ${getProfileName(t.assignee_id)}${dlStr}</div>
                    </div>
                    <div class="row" style="align-items:center;">
                        <span class="pill ${sClass}">${sLabel}</span>
                        <select onchange="updateStatus(${t.id}, this.value)">
                            <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>Chờ làm</option>
                            <option value="doing" ${t.status === 'doing' ? 'selected' : ''}>Đang làm</option>
                            <option value="done" ${t.status === 'done' ? 'selected' : ''}>Đã xong</option>
                        </select>
                        ${isAdmin ? `<button onclick="deleteTask(${t.id})">Xóa</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    sb.auth.onAuthStateChange(async (_event, session) => {
        currentUser = session?.user || null;
        const loggedIn = Boolean(currentUser);
        document.getElementById('authCard').classList.toggle('hidden', loggedIn);
        document.getElementById('appCard').classList.toggle('hidden', !loggedIn);
        document.getElementById('sessionBar').classList.toggle('hidden', !loggedIn);

        if (loggedIn) {
            await refreshAll();
            await setupPresenceChannel();
        } else {
            await leavePresenceChannel();
        }
    });
</script>
</body>
</html>
